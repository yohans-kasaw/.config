session_name: selfware
windows:
- window_name: web
  start_directory: /home/yohansh/projects/selfware/web
  panes:
  - shell_command: nvim
- window_name: back
  start_directory: /home/yohansh/projects/selfware/backend
  panes:
  - shell_command: nvim
- window_name: run
  layout: even-horizontal
  panes:
  - shell_command:
    - hyprctl dispatch 'hl.dsp.exec_cmd("firefox http://localhost:5173", { workspace = "4" })'
    - cd /home/yohansh/projects/selfware/web
    - bun run dev
  - shell_command:
    - docker compose -f /home/yohansh/config/my-dockers/postgres.yaml up -d
    - hyprctl dispatch 'hl.dsp.exec_cmd("firefox http://localhost:8000/docs", { workspace = "4" })'
    - cd /home/yohansh/projects/selfware/backend
    - fastapi dev
