# Schema for rofi-prompt-storage.yml
# 
# The file should contain a list of prompts under the `prompts` key.
# Each prompt has two fields:
#   - name: The title of the prompt, which will be displayed in the rofi menu.
#   - prompt: The actual text of the prompt.
#
# Clipboard Injection:
# To inject the current clipboard content into your prompt, use the placeholder `{{clipboard}}` 
# anywhere within the `prompt` string. The script will automatically replace this placeholder 
# with the actual clipboard content before copying the final prompt to your clipboard.

prompts:
  - name: "writing prose"
    prompt:  |
      My primary goal is to **learn**. 

      Think broadly and make intelligent connections. Introduce concepts from other fields when they genuinely illuminate the subject. Use historical context, scientific research, real-world examples, anecdotes, everyday situations, thought experiments, and concrete cases when appropriate. Abstract ideas should become intuitive without being dumbed down.

      Treat me as an intelligent, curious, avid reader. Do not assume I already know the subject, but do not talk down to me or explain obvious things unnecessarily. Build understanding progressively: establish the necessary foundations, then allow the discussion to become more sophisticated as the ideas develop.

      Most importantly, **think through the subject rather than merely listing information about it.** Let one idea naturally lead to the next. Look for the underlying mechanisms, tensions, surprising connections, historical developments, and broader implications. The reader should feel that the subject is being discovered and understood as the explanation unfolds.

      ### Writing & Prose

      Write like a **great nonfiction book**, not like an AI assistant, textbook, blog post, LinkedIn article, or Wikipedia page.

      The prose should be:

      * Elegant
      * Curious
      * Vivid
      * Literary
      * Intelligent
      * Natural
      * Occasionally humorous
      * Deep-thinking and reflective
      * Intuitive and memorable
      * Focused on the big picture without losing the important details

      Favor **continuous intellectual flow** over lists of disconnected facts. One paragraph should create a reason to read the next. Ideas should develop naturally, with transitions that emerge from the logic of the subject rather than artificial signposting.

      Use interesting introductions and headings when they improve the reading experience. Headings should feel like something you would encounter in a thoughtful nonfiction book, not generic labels such as "Introduction," "Key Points," or "Conclusion."

      Prefer paragraphs and flowing prose over bullet points. Use bullets only when the information genuinely demands a list or when they substantially improve clarity. Do not turn an interesting idea into a collection of fragments simply because lists are easy to generate.

      Use examples generously but intelligently. Historical episodes, anecdotes, everyday situations, scientific observations, thought experiments, and concrete human experiences should be used to make ideas intuitive and memorable. Do not add examples merely to fill space. A good example should illuminate the idea, complicate it, or make it difficult to forget.

      Favor **specificity over abstraction**. When an idea is difficult, find the concrete situation, observation, story, mechanism, or comparison that makes it click.

      Assume the reader appreciates substantial prose. Longer paragraphs and extended explanations are welcome when they are developing a worthwhile idea. Never shorten an explanation merely for the sake of brevity. At the same time, never pad the writing. **Every sentence must earn its place.**

      Avoid all cheap filler and recognizable AI prose. In particular, avoid:

      * Generic introductions
      * Empty rhetorical questions
      * "In today's world..."
      * "It's important to note..."
      * "Let's dive into..."
      * "There are several key..."
      * Repetitive summaries
      * Artificial transitions
      * Excessive sectioning
      * Corporate or LinkedIn-style language
      * Fake profundity
      * Unnecessary disclaimers
      * Restating the question
      * Repeating an idea in slightly different words
      * Mechanical "first, second, third" structures
      * Choppy fragments masquerading as punchy prose
      * Excessive use of em dashes
      * Writing that sounds optimized for engagement rather than understanding

      Do not constantly announce what you are about to explain. **Just explain it.**

      Do not manufacture a neat conclusion when the subject does not naturally have one. Let the final idea land naturally. There is no requirement for a "Conclusion" section or a summary at the end.

      The prose should have **rhythm**. Mix sentence lengths naturally. Allow a short sentence to land after a long thought. Use precise words. Occasionally let a sentence be beautiful simply because the idea deserves beautiful language.

      Aim for the feeling of a **deeply curious nonfiction writer thinking aloud with exceptional clarity**: someone who knows a great deal, is fascinated by the subject, sees connections across time and disciplines, and wants the reader to see them too.

      The ultimate goal is not merely that I finish reading with more information.

      It is that I finish reading with a **better mental model of the world**, and that some of the ideas remain in my head long after I have closed the page.
  - name: "Bullet Points"
    prompt: |
      Act as a professional editor specializing in transcripts and note taking.
      
      Convert the provided transcription into a clean, list of atomic bullet points.
      
      Instructions:
      1. Fix technical errors – Correct typos, punctuation, and grammatical mistakes that impede readability.
      2. Remove fillers – Eliminate excessive filler words (um, ah, like, you know) and repetitions.
      3. Improve flow – Rearrange the sequence of thoughts for logical coherence when needed.
      
      Output format requirements:
      - Produce a bulleted list only.
      - Do NOT include any summary, title, heading, or introductory sentence.
      - These bullets are for an AI to track what was said, what to add, what to remove, and what to act on.
      
      ## Input text to process:
      {{clipboard}}

  - name: "Explain exert"
    prompt: |
      explain the following exert. when explaining be witty, insight full and effective in moving your point across don't me academic and don't try to be accurate or correct. the main point is in moving your point across and help me understand.
      break it down and explain each step by step one by one. to remind the user have the part of text you are explaining. don't skip and sentences. cover every one of them. at the end give summary. 
      {
      {{clipboard}}
      }

  - name: "Fix Grammar and Issues"
    prompt: |
      Act as a professional editor specializing in conversational transcripts. Clean up the provided voice-to-text transcription. Retain my original word choices, tone, and unique phrasing. Do not formalize the language or turn it into "written prose. Fix Technical Errors: Correct obvious typos, punctuation, and grammatical mistakes that impede readability. Remove excessive filler words (um, ah, like, you know) and repetitions. improve the flow and rearrange the sentences flow of thoughts for better reading experience. Avoid em dashes.
      {
      {{clipboard}}
      }

  - name: "Vocabulary"
    prompt: |
      - { {{clipboard}} }
      - help me understand and commit to memory of the above world. do it in light way and funny way.
      - have short concise writing style; almost poetic
      - explore its origin or relation and associations of the word but only its helpful or funny.
      - the whole purpose here is to have fun and learn, no need to be correct and accurate
      - every sentence should be useful and worth reading.

  - name: "Prompt Engineering"
    prompt: |
      Improve this prompt for clarity, specificity, and usefulness. First ask me up to 3 quick clarifying questions to clear ambiguty. Then rewrite it with concrete instructions and a measurable success check.
      {
      {{clipboard}}
      }

  - name: "Code Review"
    prompt: |
      Please review the following code:
      
      ```
      {{clipboard}}
      ```
      
      Consider:
      . Code quality and adherence to best practices
      . Potential bugs or edge cases
      . Readability and maintainability
      Suggest improvements and explain your reasoning for each suggestion.
      - don't dump the full code, only snippets to make your point

  - name: "Summarize Text"
    prompt: "Please provide a concise summary of the following text:\n\n{{clipboard}}"

  - name: "Refactor Code"
    prompt: "Refactor the following code to improve readability and performance:\n\n{{clipboard}}"

  - name: "Explain Code"
    prompt: "Can you explain what the following code does?\n\n{{clipboard}}"

  - name: "Comedy Dictionary"
    prompt: |
      Role: You are a cynical, quick-witted lexicographer for 'The Cynic’s Lexicon,' a dictionary known for brutal honesty and observational comedy.
      
      Task: Define the following word using sharp irony, hyperbole, and a touch of sarcasm. Avoid cheesy puns; aim for 'Douglas Adams' style wit.
      
      Structure your response as follows:
      0. Short formal accurate definition in case it needed
      1. **Word & Phonetic Spelling**: Create a ridiculous phonetic pronunciation.
      2. **The Real Definition**: A brutally honest take on what the word actually means in the modern world.
      3. **The Sad Truth**: A one-sentence existential realization about the word.
      4. **In the Wild**: Two funny examples of the word being used in a sentence.

      Word: {{clipboard}}

  - name: "Cynic’s Dictionary"
    prompt: |
      Role: You are the exhausted, wildly cynical chief editor of 'The Devil’s Modern Dictionary'. You are deeply tired of humanity and use your dictionary definitions as a socially acceptable way to roast society.

      Task: Write a brutally honest, darkly comedic dictionary entry for the word below.

      Instructions: Do NOT use lists or rigid structures. Instead, weave the entry into a natural, flowing paragraph or two. Start with the word and a completely ridiculous phonetic spelling. Then, launch into a hyper-sarcastic definition that reveals the sad truth of what the word actually means in the modern world. Finish by casually dropping a weirdly specific, funny example of how it’s used in daily life. Channel the existential wit of Douglas Adams and the biting satire of Ambrose Bierce. No cheesy puns.

      Word: {{clipboard}}
